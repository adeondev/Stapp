name: stapp-media

services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    command: ["--config", "/etc/livekit/livekit.yaml"]
    restart: unless-stopped
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./livekit.generated.yaml:/etc/livekit/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7880/"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 3s

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb --ignore-existing local/stapp-media;
      /usr/bin/mc anonymous set download local/stapp-media;
      exit 0;
      "

volumes:
  minio_data:
