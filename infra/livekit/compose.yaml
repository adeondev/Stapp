name: stapp-livekit

services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    command: ["--config", "/etc/livekit/livekit.yaml"]
    restart: unless-stopped
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    volumes:
      - ./livekit.generated.yaml:/etc/livekit/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7880/"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 3s

# Anexos sao servidos pelo proprio Stapp; esta stack sobe somente o LiveKit.
