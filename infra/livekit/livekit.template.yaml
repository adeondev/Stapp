port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  udp_port: 7882
  node_ip: "__NODE_IP__"
  use_external_ip: false
  advertise_internal_ip: true
  enable_loopback_candidate: true
  allow_tcp_fallback: true

room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 20
  max_participants: 6
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/vp8
    - mime: video/h264
    - mime: video/vp9

# Deteccao de quem esta falando — e ela que acende o anel verde no cliente.
#
# O padrao do LiveKit e `active_level: 35` (-35 dBov) com 40% do intervalo acima
# desse nivel. Isso e voz projetada: quem fala em volume medio, longe do
# microfone ou sem ganho automatico fica por volta de -45 dBov e simplesmente
# nunca era anunciado como falante. Descer o nivel e o percentil, e olhar em
# janelas mais curtas, acende o anel quando a pessoa realmente fala.
audio:
  active_level: 45
  min_percentile: 15
  update_interval: 250
  smooth_intervals: 2

turn:
  enabled: false

enable_data_tracks: false

logging:
  level: info
  pion_level: error
  json: false

keys:
  "__API_KEY__": "__API_SECRET__"
