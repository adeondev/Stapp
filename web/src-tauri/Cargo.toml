[package]
name = "stapp-desktop"
version = "0.1.0-beta.6"
description = "Cliente desktop privado do Stapp"
authors = ["Stapp"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "stapp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
xcap = "0.9.8"
url = "2"
time = "0.3"
rayon = "1.10"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
wasapi = "0.23"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

[profile.release]
# Perfil calibrado para tempo de CI, nao para o ultimo 1% de performance.
# `lto = "fat"` + `codegen-units = 1` deixavam a fase final de link em uma
# unica thread e sozinhas respondiam por boa parte da hora de build.
# "thin" faz LTO em paralelo e 16 unidades ocupam todos os nucleos da VM.
debug = false
strip = true
lto = "thin"
codegen-units = 16
