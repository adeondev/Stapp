# Config do servidor Stapp. E o "server.properties" daqui — edite e reinicie.

[server]
name      = "Stapp dos guri"
bind      = "0.0.0.0"
port      = 8787
max_users = 20
# Descomente em producao para o proprio servidor entregar o cliente ja buildado
# (mesma origem, sem CORS). Caminho relativo a este arquivo.
# static_dir = "../web/dist"

[auth]
# Quando false, apenas o dono do host cria contas com `stapp-server user add`.
allow_registration = true
# Uma conta aparece uma vez na lista online, mas pode manter algumas conexoes.
max_sessions_per_user = 3
# Aceita autenticacao sem TLS em redes privadas locais (LAN RFC1918 192.168.x.x, 10.x.x.x, 172.16.x.x),
# CGNAT/Tailscale (100.64.0.0/10) e Radmin VPN (26.0.0.0/8).
# Para servidores expostos publicamente na internet sem proxy reverso TLS, deixe false.
trust_private_networks = true
# Faixas IP explicitas adicionais onde a autenticacao sem TLS e aceita.
trusted_networks = []
# Se o cliente web for hospedado em outra origem, declare cada origem exata.
# Nunca use curingas. Tauri e a mesma origem do servidor ja sao reconhecidos automaticamente.
allowed_origins = [
  "http://localhost:5173",
]

[[channels]]
id   = "geral"
name = "geral"
kind = "text"

[[channels]]
id   = "random"
name = "random"
kind = "text"

[[channels]]
id   = "sala"
name = "Sala de voz"
kind = "voice"

[voice]
# LiveKit SFU e o backend definitivo para chamadas de voz, video e compartilhamento de tela.
# Opcoes de backend: "livekit" (padrao) ou "disabled" (desativa salas de voz).
backend     = "livekit"
ice_servers = ["stun:stun.l.google.com:19302"]
max_peers   = 6
# Enderecos do servidor LiveKit SFU.
public_url  = "ws://127.0.0.1:7880"
api_url     = "http://127.0.0.1:7880"
# Credenciais do LiveKit: chaves padrao do modo desenvolvedor ("devkey" / "secret").
# ATENCAO: Em producao, troque estas credenciais ou defina no arquivo .env!
api_key     = "devkey"
api_secret  = "secret"
# Nomes das variaveis de ambiente caso prefira injetar pelo .env ou shell:
api_key_env = "STAPP_LIVEKIT_API_KEY"
api_secret_env = "STAPP_LIVEKIT_API_SECRET"

[limits]
# Tamanho maximo de um anexo, em MB. O cliente recebe isto no welcome e barra
# antes de subir; o servidor confere de novo no /attachments/presign.
max_upload_mb  = 20
# Tamanho maximo do texto de uma mensagem, em caracteres (nao bytes).
max_text_chars = 4000
max_attachments_per_message = 10

[storage]
database      = "data/stapp.db"
history_limit = 200
attachments_dir = "data/attachments"

# S3/MinIO e opcional e so entra em builds `cargo build --features s3`.

[tls]
# Ativa terminacao TLS direta no executavel do Stapp (ACME Let's Encrypt ou certificados manuais).
enabled = false
port = 443
# Dominios para emissao automatica via Let's Encrypt (TLS-ALPN-01)
domains = []
# Contato de e-mail para avisos de expiracao do Let's Encrypt (recomendado)
email = ""
# Diretorio para cache persistente de certificados emitidos
cache_dir = "data/acme"
# Defina como true para ambiente de producao do Let's Encrypt; false usa staging (evita rate limits em testes)
production = false
# Para uso com certificados proprios (ex: gerados via mkcert ou comprados), descomente:
# cert_file = "data/cert.pem"
# key_file = "data/key.pem"
# Redireciona requisicoes HTTP comuns para HTTPS automaticamente na porta informada:
# http_redirect_port = 80

