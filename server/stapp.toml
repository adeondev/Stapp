# Config do servidor Stapp. E o "server.properties" daqui — edite e reinicie.

[server]
name      = "Stapp dos guri"
bind      = "0.0.0.0"
port      = 8787
max_users = 20
# Descomente em producao para o proprio servidor entregar o cliente ja buildado
# (mesma origem, sem CORS). Caminho relativo a este arquivo.
# static_dir = "../web/dist"

[auth]
# Quando false, apenas o dono do host cria contas com `stapp-server user add`.
allow_registration = true
# Uma conta aparece uma vez na lista online, mas pode manter algumas conexoes.
max_sessions_per_user = 3
# Redes onde da para autenticar sem TLS, alem do loopback (que sempre passa).
# Sem TLS, a senha viaja no endpoint HTTP de login. So entre aqui rede que voce
# controla. 26.0.0.0/8 e a faixa do Radmin VPN — o trafego entre os peers ja vai
# cifrado pela propria VPN. Mesmo aqui, "Lembrar usuario" exige HTTPS.
trusted_networks = ["26.0.0.0/8"]
# Se o cliente web for hospedado em outra origem, declare cada origem exata.
# Nunca use curingas. Tauri e a mesma origem do servidor ja sao reconhecidos.
# Esta origem e a usada por `pnpm app` durante o desenvolvimento local.
allowed_origins = [
  "http://localhost:5173",
  # O amigo abre o cliente pelo IP do Radmin desta maquina; sem esta linha o
  # login dele volta 403 antes mesmo de conferir a senha. Se o IP do Radmin
  # mudar, esta linha muda junto.
  "http://26.220.166.121:5173",
]

[[channels]]
id   = "geral"
name = "geral"
kind = "text"

[[channels]]
id   = "random"
name = "random"
kind = "text"

[[channels]]
id   = "sala"
name = "Sala de voz"
kind = "voice"

[voice]
# "mesh" e contingencia. O script infra/livekit/Start-LiveKit.ps1 gera uma
# copia local com "livekit" sem colocar segredos neste arquivo.
backend     = "mesh"
ice_servers = ["stun:stun.l.google.com:19302"]
max_peers   = 6
# Enderecos sem segredo. O script troca public_url pelo IP Radmin escolhido.
public_url  = "ws://127.0.0.1:7880"
api_url     = "http://127.0.0.1:7880"
api_key_env = "STAPP_LIVEKIT_API_KEY"
api_secret_env = "STAPP_LIVEKIT_API_SECRET"

[storage]
database      = "data/stapp.db"
history_limit = 200
