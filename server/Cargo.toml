[package]
name = "stapp-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Servidor do Stapp — chat de texto e sinalizacao de voz"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ipnet = { version = "2", features = ["serde"] }
# So o avatar precisa disto: decodificar o que subiram (sem confiar na extensao),
# redimensionar e gravar sempre no mesmo formato.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
livekit-api = { version = "0.6.4", default-features = false, features = ["access-token", "services-tokio", "rustls-tls-native-roots"] }
rpassword = "7"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = "1"
tower-http = { version = "0.7", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
scraper = "0.22"
url = "2"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls", "behavior-version-latest"] }
aws-config = { version = "1", default-features = false, features = ["rustls", "behavior-version-latest"] }
aws-credential-types = "1"
aws-smithy-async = { version = "1", features = ["rt-tokio"] }

# So os testes de integracao em tests/ precisam de um cliente WebSocket.
[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = "0.29"

[profile.release]
lto = true
codegen-units = 1
strip = true
