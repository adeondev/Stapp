[package]
name = "stapp-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Servidor do Stapp — chat de texto e sinalizacao de voz"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
toml = "1"
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
